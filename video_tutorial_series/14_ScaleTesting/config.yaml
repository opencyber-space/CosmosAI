# Database Configuration
database:
  enabled: true  # Enable database logging
  type: "timescaledb"  # firestore, timescaledb, mongodb, etc.
  enableStats: true #For enabling stats dumping in DB
  enableRequestResponse: false #For enabling Request Response dumping in DB
  
  # TimescaleDB Configuration
  timescaledb:
    host: "x.x.x.x"
    port: 30954
    username: "tsdbuser"
    database: "transactions"
    password: "abcxyz"  # Fallback if env var not set
    schema: "load_testing"  # Schema for our tables
    table_prefix: "lt_"  # Prefix for table names
    connection_pool_size: 5
    max_overflow: 10
    
  # Firestore Configuration (keep existing)
  firestore:
    project_id: "myproject-738901"
    credentials_path: "path/to/service-account.json"
    collection_name: "temp"
    email: scaletest-firestore-writer@myproject-738901.iam.gserviceaccount.com

  dma_logging_end_point: "http://DMASERVER:12345/create_entry"

# Logging Configuration
logging:
  level: "INFO"
  log_file: "load_test.log"
  console_output: true
  timezone: "Asia/Kolkata"

# Test Configuration
test_config:
  duration_hours: 200
  warm_up_minutes: 5
  cool_down_minutes: 5
  health_check_interval: 60  # seconds
  stats_log_interval: 60  # seconds - how often to log statistics (both cumulative and interval)

DMA:
  type: "timescaledb"
  timescaledb:
    name: "timescaledb"
    user: "tsuser"
    password: "abcxyz"
    host: "x.x.x.x"
    port: 30008
    schema: timescaledb
    database: timescaledb
    table_name: log_entries