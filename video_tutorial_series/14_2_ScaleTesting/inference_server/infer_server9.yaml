apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-server-009
  namespace: inference-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-server-009
  template:
    metadata:
      labels:
        app: inference-server-009
    spec:
      containers:
        - name: inference-server
          image: MANAGEMENTMASTER:31280/block/inference_server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50052 
            - containerPort: 20000
            - containerPort: 50060
            - containerPort: 9000
          env:
            - name: INFERENCE_REDIS_HOST
              value: "CLUSTER_2_MASTER_NODE"
            - name: INFERENCE_REDIS_PORT
              value: "31939"
            - name: ADHOC_INSTANCE_ID
              value: "instance-4"
            - name: SEARCH_SERVER_API_URL
              value: "http://MANAGEMENTMASTER:30150"
            - name: INFERENCE_REDIS_INTERNAL_URL
              value: "localhost"
            - name: BLOCKS_DB_URL
              value: "http://MANAGEMENTMASTER:30100"
            - name: DISCOVERY_MODE
              value: "gateway"
            - name: INCLUSTER_REDIS_HOST
              value: inference-server-009.inference-server.svc.cluster.local
            - name: CLUSTER_ID
              value: "gcp-cluster-2"
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: inference-server-009
  namespace: inference-server
spec:
  selector:
    app: inference-server-009
  ports:
    - name: grpc
      protocol: TCP
      port: 50052
      targetPort: 50052
      nodePort: 31936
    - name: rest
      protocol: TCP
      port: 20000
      targetPort: 20000
      nodePort: 31937
    - name: api
      protocol: TCP
      port: 50060
      targetPort: 50060
      nodePort: 31938
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
      nodePort: 31939
    - name: metrics
      protocol: TCP
      port: 9000
      targetPort: 9000
      nodePort: 31940
  type: NodePort