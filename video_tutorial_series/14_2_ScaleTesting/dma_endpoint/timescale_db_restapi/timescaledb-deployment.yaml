---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner # Local PVs don't support dynamic provisioning
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: timescaledb-local-pv
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /home/shridhar.kini.g/llm_works/timescale_db_restapi # The actual path on your physical node
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - wc-cpu-node1 # REPLACE THIS with your actual node name
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-pvc-wc-cpu-node1
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage # Must match the PV and StorageClass
  resources:
    requests:
      storage: 8Gi
---
#---
# This PersistentVolumeClaim requests storage for the database data.
#apiVersion: v1
#kind: PersistentVolumeClaim
#metadata:
#  name: timescaledb-pvc
