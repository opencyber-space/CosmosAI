#---
# This is a Deployment to manage the TimescaleDB Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb-deployment-wc-cpu-node1
  labels:
    app: timescaledb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg16 # Use a recent TimescaleDB image
        ports:
        - containerPort: 5432 # TimescaleDB uses the standard PostgreSQL port
        env:
        - name: POSTGRES_USER
          value: "TIMESCALEDB_USER" # Recommended to use a dedicated user
        - name: POSTGRES_PASSWORD
          value: "TIMESCALEDB_PASSOWRD" # Change this password
        - name: POSTGRES_DB
          value: "timescaledb"
        volumeMounts:
        - name: timescaledb-storage
          mountPath: /var/lib/postgresql/data # Mount point for persistent storage
      volumes:
      - name: timescaledb-storage
        persistentVolumeClaim:
          claimName: timescaledb-pvc-wc-cpu-node1

---
# This Service exposes the TimescaleDB Deployment.
apiVersion: v1
kind: Service
metadata:
  name: timescaledb-service-masternode
  labels:
    app: timescaledb
spec:
  type: NodePort
  selector:
    app: timescaledb
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30009 # A port in the 30000-32767 range
